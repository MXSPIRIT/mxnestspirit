<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MXNestSpirit</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <span class="mark">MXNestSpirit</span>
  <span id="hostinfo" class="host">connexion…</span>
</header>

<section class="result" id="result">
  <div class="metrage"><span id="len">—</span><em>m</em></div>
  <dl>
    <div><dt>laize</dt><dd id="wid">1350 mm</dd></div>
    <div><dt>remplissage</dt><dd id="fill">—</dd></div>
    <div><dt>chute</dt><dd id="waste">—</dd></div>
  </dl>
</section>

<canvas id="preview" width="600" height="600"></canvas>
<p class="hint" id="hint">Ouvre ton kit, puis analyse le document.</p>

<section class="pane">
  <div class="grid3">
    <div><label for="sheet">Laize (mm)</label><input id="sheet" type="number" value="1350" min="50" step="10"></div>
    <div><label for="gap">Écart lame (mm)</label><input id="gap" type="number" value="2" min="0" step="0.5"></div>
    <div><label for="edge">Marge bord (mm)</label><input id="edge" type="number" value="5" min="0" step="1"></div>
  </div>
  <div class="grid3">
    <div><label for="maxlen">Longueur max (mm, 0 = libre)</label><input id="maxlen" type="number" value="0" min="0" step="100"></div>
  </div>
  <div class="grid3">
    <div><label for="rot">Rotation</label>
      <select id="rot">
        <option value="5">Tous les 5°</option>
        <option value="10" selected>Tous les 10°</option>
        <option value="15">Tous les 15°</option>
        <option value="30">Tous les 30°</option>
        <option value="90">Quart de tour seulement</option>
        <option value="0">Aucune rotation</option>
      </select>
    </div>
    <div><label for="prec">Précision</label>
      <select id="prec">
        <option value="1" selected>1 mm</option>
        <option value="2">0,5 mm</option>
        <option value="0.5">2 mm</option>
      </select>
    </div>
    <div><label for="effort">Recherche</label>
      <select id="effort">
        <option value="8">Rapide</option>
        <option value="16" selected>Normale</option>
        <option value="100">Maximale (le plus serré)</option>
      </select>
    </div>
  </div>
  <div class="row">
    <label for="mode">Reconnaissance des pièces</label>
    <select id="mode">
      <option value="auto" selected>Automatique</option>
      <option value="color">Même couleur que le tracé sélectionné</option>
      <option value="spot">Ton direct nommé</option>
    </select>
  </div>
  <div class="row" id="namesrow" style="display:none">
    <label for="cutnames">Noms acceptés</label>
    <input id="cutnames" type="text" value="CutContour, Cut, Découpe, Thru-cut">
  </div>
  <label class="check"><input id="refine" type="checkbox"> Affinage après calcul (10 à 15 s de plus, gagne 1 fois sur 7)</label>
  <label class="check"><input id="pairs" type="checkbox"> Emboîter les pièces deux par deux (lent, gagne rarement)</label>
  <label class="check"><input id="holes" type="checkbox" checked> Boucher les creux avec les petites pièces</label>
  <label class="check"><input id="regroup" type="checkbox" checked> Rattacher les visuels à leur contour</label>
  <label class="check"><input id="tight" type="checkbox"> Serrer au dessin plutôt qu'au masque</label>
  <label class="check"><input id="selonly" type="checkbox"> Uniquement la sélection</label>
  <label class="check"><input id="fitab" type="checkbox" checked> Ajuster le plan de travail au métrage</label>
  <div class="row" style="margin-top:8px">
    <label for="mpreset">Repères — machine</label>
    <select id="mpreset">
      <option value="valiani">Valiani — ronds 10 mm</option>
      <option value="graphtec">Graphtec CE7000 / FC9000 — angles en L</option>
      <option value="summa">Summa — à régler</option>
      <option value="zund">Zünd — à régler</option>
      <option value="roland">Roland — à régler</option>
      <option value="gerber">Gerber Edge — à régler</option>
      <option value="autre">Autre machine — à régler</option>
    </select>
  </div>
  <div class="grid3">
    <div><label for="mshape">Forme</label>
      <select id="mshape">
        <option value="circle">Rond plein</option>
        <option value="square">Carré plein</option>
        <option value="corner">Angle en L</option>
      </select>
    </div>
    <div><label for="markd">Taille (mm)</label><input id="markd" type="number" value="10" min="2" step="1"></div>
    <div><label for="marki">Retrait bord (mm)</label><input id="marki" type="number" value="10" min="0" step="1"></div>
  </div>
  <div class="grid3">
    <div><label for="markw">Trait (mm, angles)</label><input id="markw" type="number" value="1" min="0.3" max="1" step="0.1"></div>
    <div><label>&nbsp;</label><button id="marks" class="ghost" style="width:100%">Poser les repères</button></div>
    <div><label>&nbsp;</label><button id="msave" class="ghost" style="width:100%">Mémoriser</button></div>
  </div>
</section>

<section class="actions">
  <button id="scan" class="ghost">Analyser</button>
  <button id="diag" class="ghost">Que contient le fichier ?</button>
  <button id="run" class="primary" disabled>Nesting</button>
  <button id="apply" class="ghost" disabled>Appliquer</button>
</section>

<pre id="log"></pre>

<script src="js/CSInterface.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
